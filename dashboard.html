
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Lorry Condition & Delivery Monitoring Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse CDN for CSV Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation / Header -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-truck-ramp-box text-amber-400 text-2xl"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Lorry Inspection & Delivery Dashboard</h1>
                    <p class="text-xs text-slate-400">Live Lorry Condition & Arrival Monitoring System</p>
                </div>
            </div>

            <!-- Live Clock & Status -->
            <div class="flex items-center space-x-6 text-sm">
                <div class="flex items-center space-x-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                    <span class="relative flex h-3 w-3">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                    </span>
                    <span id="liveClock" class="font-mono text-emerald-400 font-semibold">--:--:--</span>
                </div>
                <button onclick="refreshData()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-lg transition text-xs flex items-center gap-1.5">
                    <i class="fa-solid fa-rotate"></i> Refresh Data
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-grow w-full">

        <!-- Controls Toolbar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap justify-between items-center gap-4">
            <!-- View Mode Switcher -->
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">View Mode:</span>
                <div class="inline-flex rounded-md shadow-sm" role="group">
                    <button type="button" id="btnModeAll" onclick="switchMode('all')"
                            class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-l-lg border border-indigo-600 hover:bg-indigo-700 transition">
                        <i class="fa-solid fa-users mr-1.5"></i> All Staff
                    </button>
                    <button type="button" id="btnModeSingle" onclick="switchMode('single')"
                            class="px-4 py-2 text-sm font-medium text-slate-700 bg-white rounded-r-lg border border-slate-300 hover:bg-slate-50 transition">
                        <i class="fa-solid fa-user mr-1.5"></i> Single Staff
                    </button>
                </div>
            </div>

            <!-- Staff Selector (Only active in Single Staff Mode) -->
            <div id="staffSelectContainer" class="flex items-center space-x-2 opacity-50 pointer-events-none transition-all">
                <label for="staffSelect" class="text-xs font-bold text-slate-500 uppercase">Select Staff:</label>
                <select id="staffSelect" onchange="onStaffSelectChange()" class="bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 min-w-[200px]">
                    <!-- Dynamic Options -->
                </select>
            </div>
        </div>

        <!-- Metric KPI Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500">Monitored Staff</p>
                    <p class="text-2xl font-bold text-slate-900 mt-1" id="kpiStaffCount">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-user-gear"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500">Total Inspections</p>
                    <p class="text-2xl font-bold text-slate-900 mt-1" id="kpiOrderCount">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-clipboard-list"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500">Completed Orders</p>
                    <p class="text-2xl font-bold text-emerald-600 mt-1" id="kpiCompletedCount">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-500">Arrival Logs Recorded</p>
                    <p class="text-2xl font-bold text-indigo-600 mt-1" id="kpiArriveCount">0</p>
                </div>
                <div class="w-10 h-10 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-lg">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
            </div>
        </div>

        <!-- Dynamic Content Area -->
        <div id="dashboardContent" class="space-y-6">
            <!-- Rendered by JS -->
        </div>
    </main>

    <!-- Photo Lightbox Modal -->
    <div id="photoModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="relative max-w-4xl w-full bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-700">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 id="modalTitle" class="text-white font-semibold text-sm">Photo Preview</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl font-bold">
                    &times;
                </button>
            </div>
            <div class="p-6 flex items-center justify-center min-h-[300px]">
                <img id="modalImage" src="" alt="Photo Preview" class="max-h-[70vh] object-contain rounded-lg">
            </div>
            <div class="p-3 bg-slate-950 text-center text-xs text-slate-400" id="modalCaption">
                --
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Datasets matching the CSV schema
        const mockStaffData = [
            { "Staff Name": "weien", "Staff Email": "weien2817@gmail.com" }
        ];

        const mockOrdersData = [
            { "Inspection ID": "717dde8a", "Staff Name": "weien", "Staff Email": "weien2817@gmail.com", "Date&Time Before": "2026-08-07 14:21:26", "Lorry Plate Number": "FSR", "Date&Time After": "2026-08-09 23:15:46", "Status": "Completed" },
            { "Inspection ID": "2a37f46c", "Staff Name": "weien", "Staff Email": "weien2817@gmail.com", "Date&Time Before": "2026-08-08 10:10:06", "Lorry Plate Number": "JDJ 9359", "Date&Time After": "2026-08-09 23:15:48", "Status": "Completed" },
            { "Inspection ID": "4a15e314", "Staff Name": "weien", "Staff Email": "weien2817@gmail.com", "Date&Time Before": "2026-08-08 11:48:45", "Lorry Plate Number": "WET 4580", "Date&Time After": "2026-08-08 11:48:45", "Status": "In Progress" },
            { "Inspection ID": "bf5d8e00", "Staff Name": "weien", "Staff Email": "weien2817@gmail.com", "Date&Time Before": "2026-08-09 23:36:50", "Lorry Plate Number": "KIM 3959", "Date&Time After": "2026-08-09 23:39:01", "Status": "Completed" }
        ];

        const mockArriveData = [
            // Arrive 1
            { stop: 1, "Inspection ID": "717dde8a", "Staff Email": "weien2817@gmail.com", time: "2026-08-07 16:03:07", gps: "2.004833, 103.276992", address: "10, Jln Teknologi 1, Kawasan Perindustrian Mengkibol, 86000 Kluang, Johor", status: "Arrived", photos: ["Arrive 1_Images/717dde8a.Photo Lorry Temperature - Before Unloading.080358.png", "Arrive 1_Images/717dde8a.Photo All Products - After Unloading_1.080358.png", "Arrive 1_Images/717dde8a.Photo All Products - After Unloading_2.080358.png"] },
            { stop: 1, "Inspection ID": "2a37f46c", "Staff Email": "weien2817@gmail.com", time: "2026-08-08 10:31:16", gps: "2.005029, 103.276963", address: "10, Jln Teknologi 1, Kawasan Perindustrian Mengkibol, 86000 Kluang, Johor", status: "Arrived", photos: ["Arrive 1_Images/2a37f46c.Photo Lorry Temperature - Before Unloading.023611.png"] },
            { stop: 1, "Inspection ID": "4a15e314", "Staff Email": "weien2817@gmail.com", time: "2026-08-08 11:49:07", gps: "2.012364, 103.299551", address: "1, Jln 40, Taman Kluang Barat, 86000 Kluang, Johor", status: "Arrived", photos: ["Arrive 1_Images/4a15e314.Photo Lorry Temperature - Before Unloading.034946.png"] },
            { stop: 1, "Inspection ID": "bf5d8e00", "Staff Email": "weien2817@gmail.com", time: "2026-08-09 23:37:04", gps: "3.149922, 101.694462", address: "Dataran Merdeka, Kuala Lumpur City Centre, 50050 Kuala Lumpur", status: "Arrived", photos: ["Arrive 1_Images/bf5d8e00.Photo Lorry Temperature - Before Unloading.153724.png"] },
            // Arrive 2
            { stop: 2, "Inspection ID": "717dde8a", "Staff Email": "weien2817@gmail.com", time: "2026-08-08 09:31:38", gps: "2.012364, 103.299551", address: "1, Jln 40, Taman Kluang Barat, 86000 Kluang, Johor", status: "Arrived", photos: ["Arrive 2_Images/717dde8a.Photo Lorry Temperature - Before Unloading.013220.png", "Arrive 2_Images/717dde8a.Photo All Products - After Unloading_1.013220.png"] },
            // Arrive 3
            { stop: 3, "Inspection ID": "717dde8a", "Staff Email": "weien2817@gmail.com", time: "2026-08-08 11:34:45", gps: "2.012364, 103.299551", address: "1, Jln 40, Taman Kluang Barat, 86000 Kluang, Johor", status: "Arrived", photos: ["Arrive 3_Images/717dde8a.Photo Lorry Temperature - Before Unloading.033510.png"] },
            // Arrive 4
            { stop: 4, "Inspection ID": "717dde8a", "Staff Email": "weien2817@gmail.com", time: "2026-08-08 11:35:45", gps: "2.012364, 103.299551", address: "1, Jln 40, Taman Kluang Barat, 86000 Kluang, Johor", status: "Arrived", photos: ["Arrive 4_Images/717dde8a.Photo Lorry Temperature - Before Unloading.033607.png"] },
            // Arrive 5
            { stop: 5, "Inspection ID": "717dde8a", "Staff Email": "weien2817@gmail.com", time: "2026-08-10 11:17:40", gps: "2.002293, 103.277903", address: "272H+W5 Kluang, Johor, Malaysia", status: "Arrived", photos: ["Arrive 5_Images/717dde8a.Photo Lorry Temperature - Before Unloading.031809.png"] }
        ];

        // Global State
        let currentMode = 'all'; // 'all' or 'single'
        let selectedStaffEmail = '';

        // Initialize Application
        document.addEventListener('DOMContentLoaded', () => {
            initLiveClock();
            initStaffDropdown();
            renderDashboard();
        });

        // Clock Function
        function initLiveClock() {
            function updateClock() {
                const now = new Date();
                document.getElementById('liveClock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
            }
            updateClock();
            setInterval(updateClock, 1000);
        }

        // Initialize Staff Dropdown Options
        function initStaffDropdown() {
            const selectEl = document.getElementById('staffSelect');
            selectEl.innerHTML = '';
            
            mockStaffData.forEach((staff) => {
                const opt = document.createElement('option');
                opt.value = staff['Staff Email'];
                opt.textContent = `${staff['Staff Name']} (${staff['Staff Email']})`;
                selectEl.appendChild(opt);
            });

            if (mockStaffData.length > 0) {
                selectedStaffEmail = mockStaffData[0]['Staff Email'];
            }
        }

        // Switch View Modes: "All Staff" vs "Single Staff"
        function switchMode(mode) {
            currentMode = mode;
            const btnAll = document.getElementById('btnModeAll');
            const btnSingle = document.getElementById('btnModeSingle');
            const staffContainer = document.getElementById('staffSelectContainer');

            if (mode === 'all') {
                btnAll.className = "px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-l-lg border border-indigo-600 hover:bg-indigo-700 transition";
                btnSingle.className = "px-4 py-2 text-sm font-medium text-slate-700 bg-white rounded-r-lg border border-slate-300 hover:bg-slate-50 transition";
                staffContainer.classList.add('opacity-50', 'pointer-events-none');
            } else {
                btnSingle.className = "px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-r-lg border border-indigo-600 hover:bg-indigo-700 transition";
                btnAll.className = "px-4 py-2 text-sm font-medium text-slate-700 bg-white rounded-l-lg border border-slate-300 hover:bg-slate-50 transition";
                staffContainer.classList.remove('opacity-50', 'pointer-events-none');
            }

            renderDashboard();
        }

        function onStaffSelectChange() {
            selectedStaffEmail = document.getElementById('staffSelect').value;
            renderDashboard();
        }

        function refreshData() {
            renderDashboard();
        }

        // Main Render Logic
        function renderDashboard() {
            // Filter Data
            let filteredStaff = mockStaffData;
            let filteredOrders = mockOrdersData;
            let filteredArrives = mockArriveData;

            if (currentMode === 'single' && selectedStaffEmail) {
                filteredStaff = mockStaffData.filter(s => s['Staff Email'] === selectedStaffEmail);
                filteredOrders = mockOrdersData.filter(o => o['Staff Email'] === selectedStaffEmail);
                filteredArrives = mockArriveData.filter(a => a['Staff Email'] === selectedStaffEmail);
            }

            // Update Metrics KPIs
            document.getElementById('kpiStaffCount').textContent = filteredStaff.length;
            document.getElementById('kpiOrderCount').textContent = filteredOrders.length;
            document.getElementById('kpiCompletedCount').textContent = filteredOrders.filter(o => o.Status === 'Completed').length;
            document.getElementById('kpiArriveCount').textContent = filteredArrives.length;

            // Build Content HTML
            const container = document.getElementById('dashboardContent');
            container.innerHTML = '';

            filteredStaff.forEach(staff => {
                const staffOrders = filteredOrders.filter(o => o['Staff Email'] === staff['Staff Email']);
                
                const staffCard = document.createElement('div');
                staffCard.className = "bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden mb-6";
                
                staffCard.innerHTML = `
                    <!-- Staff Header Bar -->
                    <div class="bg-slate-900 text-white p-4 flex flex-wrap justify-between items-center gap-3">
                        <div class="flex items-center space-x-3">
                            <div class="w-10 h-10 rounded-full bg-indigo-500 text-white font-bold flex items-center justify-center text-lg uppercase">
                                ${staff['Staff Name'].charAt(0)}
                            </div>
                            <div>
                                <h2 class="font-bold text-base flex items-center gap-2">
                                    ${staff['Staff Name']}
                                    <span class="text-xs font-normal text-indigo-300 bg-indigo-900/60 px-2 py-0.5 rounded border border-indigo-700">Staff</span>
                                </h2>
                                <p class="text-xs text-slate-400"><i class="fa-regular fa-envelope mr-1"></i>${staff['Staff Email']}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs text-slate-400">Assigned Orders:</span>
                            <span class="ml-1 text-sm font-bold bg-slate-800 text-amber-400 px-2.5 py-1 rounded-md border border-slate-700">${staffOrders.length} Order(s)</span>
                        </div>
                    </div>

                    <!-- Orders List for this Staff -->
                    <div class="p-6 space-y-6">
                        ${staffOrders.length === 0 ? '<p class="text-slate-400 text-sm">No inspection orders found for this staff member.</p>' : ''}
                        ${staffOrders.map(order => renderOrderCard(order)).join('')}
                    </div>
                `;

                container.appendChild(staffCard);
            });
        }

        // Render Single Order Card
        function renderOrderCard(order) {
            const orderArrives = mockArriveData.filter(a => a['Inspection ID'] === order['Inspection ID']);
            const statusBadge = order.Status === 'Completed' 
                ? '<span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-emerald-300"><i class="fa-solid fa-check mr-1"></i>Completed</span>'
                : '<span class="bg-amber-100 text-amber-800 text-xs font-semibold px-2.5 py-0.5 rounded border border-amber-300"><i class="fa-solid fa-spinner animate-spin mr-1"></i>In Progress</span>';

            return `
                <div class="border border-slate-200 rounded-xl bg-slate-50/50 p-5 hover:border-indigo-300 transition">
                    <!-- Order Meta Top -->
                    <div class="flex flex-wrap justify-between items-start gap-4 pb-4 border-b border-slate-200">
                        <div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-mono font-bold bg-slate-800 text-white px-2 py-1 rounded">ID: ${order['Inspection ID']}</span>
                                <span class="text-base font-bold text-slate-800"><i class="fa-solid fa-truck text-indigo-600 mr-1.5"></i>Lorry Plate: ${order['Lorry Plate Number']}</span>
                                ${statusBadge}
                            </div>
                            <div class="flex flex-wrap gap-4 text-xs text-slate-500 mt-2">
                                <span><i class="fa-regular fa-clock text-slate-400 mr-1"></i>Inspection Start: <strong>${order['Date&Time Before']}</strong></span>
                                <span><i class="fa-solid fa-flag-checkered text-slate-400 mr-1"></i>Inspection End: <strong>${order['Date&Time After'] || 'Not Completed'}</strong></span>
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-semibold text-slate-500">Total Arrivals: ${orderArrives.length} Stop(s)</span>
                        </div>
                    </div>

                    <!-- Arrival Stops Accordion/Timeline -->
                    <div class="mt-4">
                        <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3"><i class="fa-solid fa-route text-indigo-500 mr-1.5"></i>Arrival & Unloading Log:</h4>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${orderArrives.map(arr => renderArrivalBox(arr)).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Single Arrival Box (Arrive 1 ~ 5)
        function renderArrivalBox(arr) {
            const googleMapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(arr.gps)}`;

            return `
                <div class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                        <!-- Header -->
                        <div class="flex justify-between items-center mb-2">
                            <span class="bg-indigo-50 text-indigo-700 font-bold text-xs px-2 py-0.5 rounded border border-indigo-200">
                                Stop ${arr.stop} (Arrive ${arr.stop})
                            </span>
                            <span class="text-xs text-slate-400"><i class="fa-regular fa-clock mr-1"></i>${arr.time.split(' ')[1]}</span>
                        </div>

                        <!-- Date & Location -->
                        <p class="text-xs text-slate-600 font-medium mb-1"><i class="fa-regular fa-calendar-alt text-slate-400 mr-1"></i>${arr.time}</p>
                        <p class="text-xs text-slate-700 line-clamp-2 mb-2" title="${arr.address}">
                            <i class="fa-solid fa-location-dot text-red-500 mr-1"></i>${arr.address}
                        </p>

                        <!-- GPS Badge -->
                        <a href="${googleMapUrl}" target="_blank" class="inline-flex items-center text-[11px] text-blue-600 hover:text-blue-800 bg-blue-50 px-2 py-0.5 rounded mb-3">
                            <i class="fa-solid fa-map-pin mr-1"></i>GPS: ${arr.gps} <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-[9px]"></i>
                        </a>

                        <!-- Photos Preview Section -->
                        <div class="mt-2 border-t border-slate-100 pt-2">
                            <span class="text-[11px] font-semibold text-slate-500 block mb-1.5">Photo Records (${arr.photos.length}):</span>
                            <div class="flex flex-wrap gap-2">
                                ${arr.photos.map((photo, i) => `
                                    <div onclick="openModal('${photo}', 'Stop ${arr.stop} - Photo #${i+1}')" class="w-12 h-12 bg-slate-100 rounded border border-slate-200 overflow-hidden cursor-pointer hover:opacity-80 transition relative group">
                                        <div class="w-full h-full flex items-center justify-center bg-slate-800 text-slate-300 text-[10px] text-center p-0.5">
                                            <i class="fa-solid fa-image"></i>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Modal Functions for Photo Lightbox
        function openModal(imgSrc, title) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalImage').src = imgSrc;
            document.getElementById('modalCaption').textContent = `File Path: ${imgSrc}`;
            document.getElementById('photoModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.add('hidden');
        }
    </script>
</body>
</html>
