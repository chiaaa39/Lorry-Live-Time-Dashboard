

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse TV Live Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <header class="header">
      <div class="title-section">
        <h1>WAREHOUSE LIVE MONITORING</h1>
        <span class="live-badge">LIVE TV</span>
      </div>
      <div class="controls-section">
        <label for="staffFilter">Staff Filter:</label>
        <select id="staffFilter">
          <option value="ALL">-- ALL STAFF --</option>
        </select>
      </div>
      <div class="clock-section">
        <div id="clockTime" class="clock-time">00:00:00</div>
        <div id="clockDate" class="clock-date">YYYY-MM-DD</div>
      </div>
    </header>

    <main class="content">
      <div class="summary-cards">
        <div class="card">
          <span class="card-label">Active Staff</span>
          <span id="statStaffCount" class="card-value">0</span>
        </div>
        <div class="card">
          <span class="card-label">Total Inspections</span>
          <span id="statTotalOrders" class="card-value">0</span>
        </div>
        <div class="card">
          <span class="card-label">Completed</span>
          <span id="statCompleted" class="card-value green">0</span>
        </div>
      </div>

      <div id="ordersGrid" class="orders-grid">
        <!-- JS 动态渲染卡片 -->
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
